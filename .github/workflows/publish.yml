name: Publish Package to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm version
        run: npm install --global npm@^11.21.0

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "Release tag $TAG does not match package version $VERSION"
            exit 1
          fi

      - name: Verify package
        run: npm run check

      - name: Inspect package contents
        run: npm run pack:check

      - name: Publish prerelease to npm next
        if: ${{ github.event.release.prerelease }}
        run: npm publish --access public --tag next

      - name: Publish stable release to npm latest
        if: ${{ !github.event.release.prerelease }}
        run: npm publish --access public --tag latest
